[package]
name = "negpy_mobile"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "negpy_mobile"
crate-type = ["staticlib", "rlib"]

[features]
# The Swift bindings; off for `cargo test`, on for the xcframework build.
ffi = ["dep:uniffi"]

[dependencies]
negpy_core = { path = "../../negpy_core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
libm = "0.2"
miniz_oxide = "0.8"
uniffi = { version = "0.32", optional = true, features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi"]

[dev-dependencies]
