[package]
name = "negpy_mobile"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "negpy_mobile"
crate-type = ["staticlib", "rlib"]

[dependencies]
negpy_core = { path = "../../negpy_core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
libm = "0.2"

[dev-dependencies]
